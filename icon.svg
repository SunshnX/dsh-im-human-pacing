<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" role="img" aria-label="Two chat bubbles with a typing pause between them">
  <defs>
    <linearGradient id="pacingBubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#4A79D8"/>
    </linearGradient>
  </defs>

  <!-- leading bubble -->
  <path d="M7 7.5h13.5A3.5 3.5 0 0 1 24 11v3.5a3.5 3.5 0 0 1-3.5 3.5H12l-3.2 3v-3H7A3.5 3.5 0 0 1 3.5 14.5V11A3.5 3.5 0 0 1 7 7.5z" fill="url(#pacingBubble)"/>

  <!-- typing pause: three small dots stepping down to the next bubble -->
  <g fill="#7E8B99">
    <circle cx="14" cy="19.6" r="1.05" opacity="0.85"/>
    <circle cx="18" cy="21.4" r="1.05" opacity="0.6"/>
    <circle cx="22" cy="23.2" r="1.05" opacity="0.4"/>
  </g>

  <!-- trailing bubble, slightly offset to read as "and then" -->
  <path d="M16 22h13.5A3.5 3.5 0 0 1 33 25.5V29a3.5 3.5 0 0 1-3.5 3.5H24l-3.2 3v-3H16a3.5 3.5 0 0 1-3.5-3.5V25.5A3.5 3.5 0 0 1 16 22z" fill="url(#pacingBubble)" opacity="0.72"/>
</svg>
